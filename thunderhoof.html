// ---------- audio ----------
let AC = null, noiseBuf = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, slide) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + d);
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.001, n + d);
  o.connect(g).connect(a.destination); o.start(n); o.stop(n + d);
}
function noise(d, v, f, q) {
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const bf = a.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = f; bf.Q.value = q || 1;
  const g = a.createGain(), n = a.currentTime;
  g.gain.setValueAtTime(0.0001, n);
  g.gain.exponentialRampToValueAtTime(v, n + Math.min(0.3, d * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  s.connect(bf).connect(g).connect(a.destination); s.start(n); s.stop(n + d + 0.05);
}

function route(node, pan = 0) {

// Karplus–Strong plucked strings: a burst of noise ringing around a tiny delay loop.
// Each note is rendered once into a buffer and reused.
const pluckCache = {};
function pluck(midi, kind) {
  const key = kind + midi;
  if (pluckCache[key]) return pluckCache[key];
  const sr = AC.sampleRate, N = Math.max(2, Math.round(sr / mtof(midi)));
  const [decay, bright, dur] = { banjo: [0.993, 0.9, 0.8], guitar: [0.996, 0.55, 1.2], bass: [0.9985, 0.22, 1.5] }[kind];
  const len = Math.floor(sr * dur), buf = AC.createBuffer(1, len, sr), out = buf.getChannelData(0), ring = new Float32Array(N);
  let lp = 0;
  for (let i = 0; i < N; i++) { lp += (Math.random() * 2 - 1 - lp) * bright; ring[i] = lp; }   // softer pick = smoother noise
  for (let i = 0, k = 0; i < len; i++) {
    const a = ring[k], b = ring[(k + 1) % N];
    out[i] = a; ring[k] = decay * 0.5 * (a + b); k = (k + 1) % N;
  }
  for (let i = 0; i < 400 && i < len; i++) out[len - 1 - i] *= i / 400;   // no click at the tail
  return (pluckCache[key] = { buf, rate: mtof(midi) / (sr / N) });     // playbackRate fixes the rounding in N
}
function playPluck(midi, t, kind, vol, pan) {
  const p = pluck(midi, kind), src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = p.buf; src.playbackRate.value = p.rate; g.gain.value = vol;
  src.connect(g); route(g, pan); src.start(t);
}
// bowed fiddle: two detuned saws through a body resonance, vibrato fading in
function fiddle(midi, t, dur, vol) {
  const f = mtof(midi), g = AC.createGain(), lp = AC.createBiquadFilter(), body = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2800; lp.Q.value = 1.1;
  body.type = 'peaking'; body.frequency.value = 950; body.gain.value = 6; body.Q.value = 1.2;
  const vib = AC.createOscillator(), vibG = AC.createGain();
  vib.frequency.value = 5.6;
  vibG.gain.setValueAtTime(0, t); vibG.gain.linearRampToValueAtTime(f * 0.007, t + Math.min(0.3, dur));
  vib.connect(vibG);
  for (const det of [-5, 5]) {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
    vibG.connect(o.frequency); o.connect(lp); o.start(t); o.stop(t + dur + 0.2);
  }
  lp.connect(body).connect(g);
  const att = Math.min(0.05, dur * 0.3);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.linearRampToValueAtTime(vol * 0.8, t + Math.max(att + 0.01, dur));
  g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.15);
  vib.start(t); vib.stop(t + dur + 0.2);
  route(g, 0.05);

    G.results.push({ bull: b.name, score: R.score.total, time: R.finalT });
  } else {
    G.results.push({ bull: b.name, score: null, time: R.finalT });
  }
  G.mode = 'result'; G.resT = 0;
}

// ---------- update ----------
function update(dt) {
  T += dt;
  G.excite = clamp(G.excite * Math.pow(0.6, dt), 0.15, 2);
  if (G.mode === 'menu' || G.mode === 'chute') {
    animBull(dt, bull(), 0.12);
    R.bx = 140;
    if (G.opening) {
      G.gate -= dt * 3.5;
      if (G.gate <= 0) { G.gate = 0; G.opening = false; G.mode = 'ride'; R.state = 'on'; sfx.cheer(1.6, 0.2); G.excite = 0.8; }
    }
  } else if (G.mode === 'ride') updateRide(dt);
  else { G.resT += dt; if (R.rag) updateRag(dt); }
  // the bull snorts steam when he's winding up (and now and then in the chute)
  const angry = G.mode === 'ride' && R.state === 'on' && R.tel;
  if (R.nose && G.mode !== 'result' && G.mode !== 'final' && (angry ? Math.random() < 0.6 : Math.random() < dt * 0.6)) {
    const fx = Math.cos(R.spinPhase), fz = -Math.sin(R.spinPhase);
    for (let k = 0; k < (angry ? 1 : 6); k++) { const sp = rand(40, 110);
      parts.push({ x: R.nose.x, y: R.nose.y, z: R.nose.z, vx: fx * sp, vz: fz * sp / S, vy: rand(-30, 10),
        life: rand(0.3, 0.6), max: 0.6, r: rand(2, 5), steam: true }); }
    if (parts.length > 260) parts.splice(0, parts.length - 260);
  }
  if (G.mode !== 'chute' && G.mode !== 'menu' && G.gate < 1 && G.mode !== 'ride') G.gate = Math.min(1, G.gate + dt);

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.z += (p.vz || 0) * dt; p.vy += (p.steam ? -30 : 60) * dt; p.vx *= 0.97; p.r += 14 * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = msgs.length - 1; i >= 0; i--) { const m = msgs[i]; m.life -= dt; m.y -= 30 * dt; if (m.life <= 0) msgs.splice(i, 1); }
}

  m.root.position.set(toWX(R.bx + R.lurch), R.hop / S, 0);
  const cs = 4.2 - R.hop / S * 1.5; contact.position.x = toWX(R.bx + R.lurch); contact.scale.set(cs, cs * 0.55, 1);
  contact.material.opacity = 1 - clamp(R.hop / 50, 0, 0.6);
  m.yaw.rotation.y = R.spinPhase + clamp(R.lurchV * 0.0009, -0.35, 0.35);   // hips twist with the yank
  m.pitch.rotation.z = -R.pitch;
  const gait = R.ph * 2, s1 = Math.sin(gait), s2 = Math.sin(gait + Math.PI);
  const tuck = clamp(R.hop / 26, 0, 1), kick = clamp(R.pitch * 2.6, 0, 1);
  [[0.1 + s1 * 0.22 + tuck * 0.55, -0.05 - tuck * 1.5], [0.1 + s2 * 0.22 + tuck * 0.55, -0.05 - tuck * 1.5],
   [-0.15 + s2 * 0.2 - kick, 0.3 - kick * 0.1], [-0.15 + s1 * 0.2 - kick, 0.3 - kick * 0.1]].forEach(([a1, a2], i) => {
    m.legs[i].hip.rotation.z = a1; m.legs[i].knee.rotation.z = a2;
  });
  m.tail.forEach((g, i) => {
    g.rotation.z = i ? -0.1 - R.pitch * 0.3 : -0.45 - R.pitch * 2.2 - kick * 0.4;
    g.rotation.x = Math.sin(T * 5 + R.ph + i * 0.6) * 0.16;
  });
  m.head.rotation.z = -(0.55 + Math.sin(R.ph) * 0.15 + (R.tel ? 0.3 : 0));
  // nostrils flare when he's winding up; tongue flops out on the big kicks
  const flare = R.tel ? 1.35 + Math.sin(T * 30) * 0.1 : 1;
  m.nostrils.forEach(n => n.scale.set(0.05 * flare, 0.07 * flare, 0.05 * flare));
  m.tongue.visible = R.pitch > 0.18 || R.hop > 22;
  m.root.updateMatrixWorld(true);
  m.nose.getWorldPosition(tmpV);
  R.nose = { x: tmpV.x * S + W / 2, y: GY - tmpV.y * S, z: tmpV.z };

  // rider: on the bull, or tumbling through the air
  const r = rider;
  const pi = G.players > 1 ? G.cur : 0;
  RIDER_SHIRT.color.copy(PCOLORS_LIN[pi]);
  r.skinM.color.copy(SKIN_LIN[pi]); r.hairM.color.copy(HAIR_LIN[pi]);
  r.looks.forEach((g, i) => { g.visible = i === pi; });
  r.freeArm.rotation.x = -0.55 + Math.sin(T * 9) * 0.35; r.freeArm.rotation.z = 0.25;
  if (showWorld && (R.state === 'chute' || R.state === 'on')) {
    r.root.visible = true;
    m.seat.getWorldPosition(r.root.position);
    // lean happens in screen space so it matches the balance bar
    tmpQ.setFromAxisAngle(AZ, -R.bal * 1.1);
    tmpQ2.setFromAxisAngle(AY, R.spinPhase); tmpQ.multiply(tmpQ2);
    tmpQ2.setFromAxisAngle(AZ, -R.pitch * 0.5); tmpQ.multiply(tmpQ2);
    r.root.quaternion.copy(tmpQ);
    r.rideLegs.visible = true; r.standLegs.visible = false;
  } else if (showWorld && R.rag) {
    r.root.visible = true;
    r.root.position.set(toWX(R.rag.x), toWY(R.rag.y), 0.9);
    tmpQ.setFromAxisAngle(AZ, -R.rag.rot);
    tmpQ2.setFromAxisAngle(AY, R.rag.vx >= 0 ? 0 : Math.PI); tmpQ.multiply(tmpQ2);
    r.root.quaternion.copy(tmpQ);
    const stand = R.rag.pose === 'stand';
    r.rideLegs.visible = !stand; r.standLegs.visible = stand;
  } else r.root.visible = false;

  gate.rotation.y = -(1 - G.gate) * Math.PI / 2;
  updateCrowd();
  syncParts();

  // camera trails the bull with a slow drift; hard moves shake it
  camX += (toWX(R.bx) * 0.55 - camX) * 0.06;
  const sh = G.mode === 'ride' && R.state === 'on' ? Math.abs(R.pitchV) * 0.4 / S : 0;
  camera.position.set(camX + Math.sin(T * 0.13) * 0.4 + rand(-sh, sh), 2.7 + Math.sin(T * 0.21) * 0.1 + rand(-sh, sh), 8.8);
  camera.lookAt(camX * 0.9, 1.45, 0);
  camera.updateMatrixWorld();
  tmpV.set(toWX(R.bx), R.hop / S + 2.9, 0).project(camera);
  bullScreen.x = (tmpV.x + 1) / 2 * W; bullScreen.y = (1 - tmpV.y) / 2 * H;
  if (composer) composer.render(); else renderer.render(scene, camera);
}
// darken the corners so the eye goes to the bull
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.35, W / 2, H * 0.55, W * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawTelegraph() {
  const t = R.tel; if (!t) return;
  const x = clamp(bullScreen.x, 120, W - 120), y = clamp(bullScreen.y - 40, 130, 260);
  const k = clamp(t.time / t.max, 0, 1);
  const pulse = 1 + Math.sin(T * 30) * 0.04;
  ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
  let label, col;
  if (t.type === 'drop') { label = 'SIT DEEP  ▼'; col = '#ffd84d'; }
  else { label = t.dir > 0 ? '◀  LEAN' : 'LEAN  ▶'; col = t.type === 'whip' ? '#ff9f43' : '#7CFF8A'; }
  ctx.fillStyle = 'rgba(10,6,4,.8)'; rr(-110, -30, 220, 60, 14); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; rr(-110, -30, 220, 60, 14); ctx.stroke();
  text(label, 0, -6, 30, col);
  const hint = t.type === 'drop' ? 'S / ↓' : (t.dir > 0 ? 'A / ←' : 'D / →');
  if (!isTouch) text(hint, 0, 18, 12, 'rgba(255,255,255,.6)', 'center', 'normal');
  ctx.fillStyle = col; ctx.fillRect(-100, 26, 200 * k, 3);
  ctx.restore();
}

function drawHUD() {
  const b = bull();
  // scoreboard
  ctx.fillStyle = 'rgba(12,8,6,.85)'; rr(W / 2 - 160, 8, 320, 66, 10); ctx.fill();
  ctx.strokeStyle = '#d4a845'; ctx.lineWidth = 2; rr(W / 2 - 160, 8, 320, 66, 10); ctx.stroke();
  const t = G.mode === 'ride' ? (R.state === 'on' ? R.t : R.finalT) : (G.mode === 'result' ? R.finalT : 0);
  const tcol = t >= 8 ? '#7CFF8A' : (R.state === 'off' ? '#ff5a4a' : '#ffe9a8');
  text(t.toFixed(2), W / 2, 44, 40, tcol);
  text(`BULL ${G.round + 1}/${TOUR_LEN} · ${b.name.toUpperCase()}`, W / 2, 20, 12, '#d4a845');
  // progress to 8
  ctx.fillStyle = '#333'; ctx.fillRect(W / 2 - 140, 66, 280, 4);
  ctx.fillStyle = tcol; ctx.fillRect(W / 2 - 140, 66, 280 * clamp(t / 8, 0, 1), 4);
  // past the whistle the bar keeps sweeping in gold so you can feel the overtime ticking
  if (t > 8) { ctx.fillStyle = '#ffd84d'; ctx.fillRect(W / 2 - 140, 66, 280 * (((t - 8) % 2) / 2), 4); }
  if (R.qualified && G.mode === 'ride') {
    ctx.fillStyle = 'rgba(12,8,6,.85)'; rr(W / 2 - 110, 78, 220, 26, 8); ctx.fill();
    text(`OVERTIME  +${R.bonus.toFixed(2)}`, W / 2, 91, 15, '#7CFF8A');
  }
  // tour total
  const total = totalOf(G.results), multi = G.players > 1;
  ctx.fillStyle = 'rgba(12,8,6,.75)'; rr(12, 12, 150, 50, 8); ctx.fill();
  if (multi) { ctx.fillStyle = PCOLORS[G.cur]; rr(12, 12, 6, 50, 3); ctx.fill(); }
  text(multi ? pname(G.cur) + ' POINTS' : 'TOUR POINTS', 87, 27, 11, multi ? PCOLORS[G.cur] : '#d4a845');
  text(total.toFixed(2), 87, 47, 20, '#fff');
  if (multi) {
    ctx.fillStyle = 'rgba(12,8,6,.6)'; rr(12, 66, 150, 8 + G.players * 17, 8); ctx.fill();
    G.all.forEach((list, i) => {
      text('P' + (i + 1), 24, 82 + i * 17, 12, PCOLORS[i], 'left');
      text(totalOf(list).toFixed(2), 150, 82 + i * 17, 12, i === G.cur ? '#fff' : 'rgba(255,255,255,.65)', 'right', i === G.cur ? 'bold' : 'normal');
    });
  }
  if (G.mode !== 'ride' || R.state !== 'on') return;
  // grip
  ctx.fillStyle = 'rgba(12,8,6,.75)'; rr(W - 172, 12, 160, 50, 8); ctx.fill();
  text('GRIP' + (isTouch ? '' : ' (SPACE)'), W - 92, 26, 11, '#d4a845');
  ctx.fillStyle = '#333'; ctx.fillRect(W - 160, 40, 136, 12);
  ctx.fillStyle = R.grip < 0.25 ? '#ff5a4a' : (held('grip') ? '#ffd84d' : '#e8d6a8');
  ctx.fillRect(W - 160, 40, 136 * R.grip, 12);
  // balance meter
  const bx = 330, bw = 300, by = 500;
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#d63031'); g.addColorStop(0.25, '#fdcb6e'); g.addColorStop(0.5, '#00b894');
  g.addColorStop(0.75, '#fdcb6e'); g.addColorStop(1, '#d63031');
  ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(bx - 8, by - 22, bw + 16, 44, 10); ctx.fill();
  ctx.fillStyle = g; rr(bx, by - 6, bw, 12, 6); ctx.fill();
  const mx = bx + bw / 2 + R.bal * bw / 2;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx, by - 8); ctx.lineTo(mx - 8, by - 20); ctx.lineTo(mx + 8, by - 20); ctx.fill();
  ctx.fillRect(mx - 2, by - 8, 4, 16);
  text('BALANCE', bx + bw / 2, by + 15, 10, 'rgba(255,255,255,.7)');
  if (R.spin) shadowText('SPINNING ' + (R.spin.dir > 0 ? '⟳' : '⟲'), W / 2, 122, 18, '#ff9f43');
  if (R.qualified) {
    const j = JUMP_BTN;
    ctx.fillStyle = 'rgba(20,90,40,.85)'; rr(j.x, j.y, j.w, j.h, 12); ctx.fill();
    ctx.strokeStyle = '#7CFF8A'; ctx.lineWidth = 2; rr(j.x, j.y, j.w, j.h, 12); ctx.stroke();
    text(isTouch ? 'JUMP OFF' : 'JUMP OFF (ENTER)', W / 2, j.y + j.h / 2, 18, '#fff');
  }
  // touch buttons
  if (isTouch) for (const btn of BTNS) {
    const on = held(btn.id);
    ctx.fillStyle = on ? 'rgba(212,168,69,.75)' : 'rgba(12,8,6,.55)'; rr(btn.x, btn.y, btn.w, btn.h, 14); ctx.fill();
    ctx.strokeStyle = '#d4a845'; ctx.lineWidth = 2; rr(btn.x, btn.y, btn.w, btn.h, 14); ctx.stroke();
    text(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2, 20, on ? '#1a0f08' : '#f3d58a');
  }
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(14,9,6,.9)'; rr(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = '#d4a845'; ctx.lineWidth = 3; rr(x, y, w, h, 16); ctx.stroke();
}
function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }
const blink = () => 0.55 + 0.45 * Math.sin(T * 4);

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
  shadowText('THUNDERHOOF', W / 2 + 90, 150, 84, '#f3d58a');
  text('A BULL RIDING SHOWDOWN AT THE DUSTBOWL', W / 2 + 90, 212, 20, '#e8d6a8');
  panel(W / 2 - 110, 240, 400, 170);
  const tap = isTouch;
  const lines = tap
    ? [['◀ / ▶', 'lean against the throw'], ['SIT ▼', 'sit deep when the bull drops'], ['GRIP', 'hold on tight (drains fast)'], ['', '8 sec to score — stay on for bonus!']]
    : [['A D / ← →', 'lean against the throw'], ['S / ↓', 'sit deep when the bull drops'], ['SPACE', 'grip tight (drains fast)'], ['', '8 sec to score — stay on for bonus!']];
  lines.forEach((l, i) => {
    text(l[0], W / 2 - 80, 270 + i * 34, 17, '#ffd84d', 'left');
    text(l[1], W / 2 + 40, 270 + i * 34, 16, '#fff', 'left', 'normal');
  });
  text('PLAYERS', W / 2 - 40, 447, 16, '#d4a845', 'right');
  for (const b of PLAYER_BTNS) {
    const on = b.n === G.players;
    ctx.fillStyle = on ? PCOLORS[b.n - 1] : 'rgba(14,9,6,.85)'; rr(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = on ? '#fff' : '#d4a845'; ctx.lineWidth = 2; rr(b.x, b.y, b.w, b.h, 9); ctx.stroke();
    text(String(b.n), b.x + b.w / 2, b.y + b.h / 2 + 1, 20, on ? '#fff' : '#f3d58a');
  }
  if (!tap) text('1–5 or ← →', W / 2 + 290, 447, 12, 'rgba(255,255,255,.55)', 'left', 'normal');
  ctx.globalAlpha = blink();
  shadowText(tap ? 'TAP TO ENTER THE CHUTE' : 'PRESS SPACE TO ENTER THE CHUTE', W / 2 + 90, 490, 22, '#fff');
  ctx.globalAlpha = 1;
  text(`${BULLS.length} bulls in the pen · 5 drawn each tour` + (best > 0 ? '  ·  Best tour: ' + best.toFixed(2) : ''), W / 2 + 90, 522, 14, '#d4a845');
}
function drawChutePrompt() {
  const b = bull();
  if (G.players > 1) shadowText(pname(G.cur) + ' — YOUR TURN', W / 2 + 140, 128, 26, PCOLORS[G.cur]);
  panel(W / 2 - 60, 150, 400, 172);
  text(`BULL ${G.round + 1} OF ${TOUR_LEN}`, W / 2 + 140, 178, 14, '#d4a845');
  shadowText(b.name.toUpperCase(), W / 2 + 140, 212, 32, '#f3d58a');
  text('RANK  ' + stars(b.diff), W / 2 + 140, 244, 18, '#ffd84d');
  text(STYLES[b.style || 'mixed'].label, W / 2 + 140, 270, 15, '#e8d6a8', 'center', 'normal');
  ctx.globalAlpha = G.opening ? 1 : blink();
  text(G.opening ? 'OUTSIDE!' : (isTouch ? 'Tap to nod your head' : 'Press SPACE to nod your head'), W / 2 + 140, 302, 17, '#fff', 'center', 'normal');
  ctx.globalAlpha = 1;
}
function drawResult() {
  const b = bull(), k = clamp(G.resT * 3, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.45 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(0.8 + 0.2 * k, 0.8 + 0.2 * k); ctx.globalAlpha = k;
  panel(-220, -150, 440, 300);
  text((G.players > 1 ? pname(G.cur) + ' · ' : '') + b.name.toUpperCase(), 0, -118, 18, G.players > 1 ? PCOLORS[G.cur] : '#d4a845');
  if (R.score) {
    shadowText('QUALIFIED RIDE', 0, -82, 34, '#7CFF8A');
    text('Rider', -130, -30, 16, '#e8d6a8'); text(R.score.rider.toFixed(2), -130, 0, 28, '#fff');
    text('Bull', 0, -30, 16, '#e8d6a8'); text(R.score.bull.toFixed(2), 0, 0, 28, '#fff');
    text('Overtime', 130, -30, 16, '#e8d6a8');
    text('+' + R.score.bonus.toFixed(2), 130, 0, 28, '#7CFF8A');
    text(`Rode ${R.finalT.toFixed(2)}s` + (R.state === 'off' ? ' — bucked off in overtime' : ''), 0, 104, 13, '#e8d6a8', 'center', 'normal');
    ctx.fillStyle = '#d4a845'; ctx.fillRect(-150, 30, 300, 2);
    shadowText(R.score.total.toFixed(2) + ' PTS', 0, 70, 46, '#ffd84d');
  } else {
    shadowText('NO SCORE', 0, -82, 38, '#ff5a4a');
    text(`Bucked off at ${R.finalT.toFixed(2)}s`, 0, -20, 22, '#fff', 'center', 'normal');
    text(['The bull wins this round.', 'Cowboy up — next one.', 'Shake off the dirt.'][G.round % 3], 0, 20, 18, '#e8d6a8', 'center', 'normal');
  }
  ctx.globalAlpha = k * blink();
  const go = isTouch ? 'Tap' : 'SPACE';
  const nextLine = G.cur < G.players - 1 ? `${go} — ${pname(G.cur + 1)}'s turn`
    : G.round + 1 >= TOUR_LEN ? `${go} for tour results` : `${go} for the next bull`;
  text(nextLine, 0, 128, 16, '#fff', 'center', 'normal');
  ctx.restore();
}
function drawFinal() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  if (G.players > 1) return drawLeaderboard();
  panel(W / 2 - 260, 60, 520, 420);
  shadowText('TOUR RESULTS', W / 2, 105, 38, '#f3d58a');
  G.results.forEach((r, i) => {
    const y = 160 + i * 42;
    text(G.tour[i].name, W / 2 - 220, y, 20, '#fff', 'left', 'normal');
    text(stars(G.tour[i].diff), W / 2 + 10, y, 14, '#ffd84d');
    text(r.score != null ? `${r.score.toFixed(2)}  (${r.time.toFixed(1)}s)` : `—  (${r.time.toFixed(2)}s)`, W / 2 + 220, y, 20, r.score != null ? '#7CFF8A' : '#ff5a4a', 'right');
  });
  const total = G.results.reduce((s, r) => s + (r.score || 0), 0);
  const rides = G.results.filter(r => r.score != null).length;
  ctx.fillStyle = '#d4a845'; ctx.fillRect(W / 2 - 220, 370, 440, 2);
  text(`${rides}/${TOUR_LEN} RIDES`, W / 2 - 220, 400, 20, '#e8d6a8', 'left');
  shadowText(total.toFixed(2), W / 2 + 220, 400, 34, '#ffd84d', 'right');
  const title = rides === 5 ? 'WORLD CHAMPION!' : rides >= 3 ? 'Buckle contender' : rides >= 1 ? 'Rookie of the year' : 'The bulls say thanks';
  text(G.newBest ? 'NEW BEST — ' + title : title, W / 2, 440, 18, G.newBest ? '#7CFF8A' : '#fff');
  ctx.globalAlpha = blink();
  text(isTouch ? 'Tap to play again' : 'SPACE to play again', W / 2, 505, 16, '#fff', 'center', 'normal');
  ctx.globalAlpha = 1;
}

function drawLeaderboard() {
  const order = G.all.map((list, i) => ({ i, total: totalOf(list), rides: list.filter(r => r.score != null).length, list }))
    .sort((a, b) => b.total - a.total);
  const tie = order.length > 1 && order[0].total === order[1].total;
  const h = 150 + G.players * 52;
  const top = H / 2 - h / 2 - 10;
  panel(W / 2 - 300, top, 600, h);
  if (tie) shadowText("IT'S A TIE!", W / 2, top + 42, 38, '#f3d58a');
  else shadowText(pname(order[0].i) + ' WINS!', W / 2, top + 42, 38, PCOLORS[order[0].i]);
  text('BUCKLE OF THE DUSTBOWL', W / 2, top + 74, 13, '#d4a845');
  order.forEach((o, rank) => {
    const y = top + 112 + rank * 52;
    if (rank === 0 && !tie) { ctx.fillStyle = 'rgba(212,168,69,.15)'; rr(W / 2 - 280, y - 22, 560, 44, 8); ctx.fill(); }
    text(['1st', '2nd', '3rd', '4th', '5th'][rank], W / 2 - 262, y, 18, '#ffd84d', 'left');
    ctx.fillStyle = PCOLORS[o.i]; ctx.beginPath(); ctx.arc(W / 2 - 200, y, 8, 0, 7); ctx.fill();
    text(pname(o.i), W / 2 - 184, y, 20, '#fff', 'left');
    // one pip per bull: green = rode it, red = bucked off
    o.list.forEach((r, k) => { ctx.fillStyle = r.score != null ? '#7CFF8A' : '#ff5a4a'; ctx.beginPath(); ctx.arc(W / 2 + 10 + k * 18, y, 5, 0, 7); ctx.fill(); });
    text(`${o.rides}/${TOUR_LEN}`, W / 2 + 120, y, 15, '#e8d6a8', 'left', 'normal');
    shadowText(o.total.toFixed(2), W / 2 + 262, y, 24, rank === 0 ? '#ffd84d' : '#fff', 'right');
  });
  if (G.newBest) text('NEW BEST TOUR!', W / 2, top + h - 24, 16, '#7CFF8A');
  ctx.globalAlpha = blink();
  text(isTouch ? 'Tap to play again' : 'SPACE to play again', W / 2, Math.min(H - 16, top + h + 26), 16, '#fff', 'center', 'normal');
  ctx.globalAlpha = 1;
}

function draw() {
  render3D();
  ctx.clearRect(0, 0, W, H);
  drawVignette();
  for (const m of msgs) {
    ctx.globalAlpha = clamp(m.life, 0, 1);
    shadowText(m.text, m.x, m.y, m.size, m.color);
  }
  ctx.globalAlpha = 1;
  if (G.mode === 'ride') { drawTelegraph(); drawHUD(); }
  else if (G.mode === 'chute') { drawHUD(); drawChutePrompt(); }
  else if (G.mode === 'menu') drawMenu();
  else if (G.mode === 'result') { drawHUD(); drawResult(); }
  else if (G.mode === 'final') drawFinal();
  drawSoundBtn();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  musicTick();
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
