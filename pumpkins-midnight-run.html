const right = () => keys.ArrowRight || keys.KeyD;

// Touch controls
const touch = { l:false, r:false, j:false };
function touchUpdate(e) {
  e.preventDefault(); initAudio();
  touch.l = touch.r = touch.j = false;
  const rect = cv.getBoundingClientRect();
  for (const t of e.touches) {
    const x = (t.clientX - rect.left) / rect.width;
    if (x < 0.2) touch.l = true; else if (x < 0.4) touch.r = true; else touch.j = true;
  }
  if (touch.j && !keys.TouchJ) pressed.Space = true;
  keys.TouchJ = touch.j; keys.ArrowLeft = touch.l; keys.ArrowRight = touch.r; keys.Space = touch.j;
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev => cv.addEventListener(ev, touchUpdate, {passive:false}));

function drawPumpkinArt(g, x, y, w, h, face, lit, blink, flick) {
  const cx = x + w / 2, cy = y + h * 0.55;
  const body = g.createRadialGradient(cx - w * 0.15, cy - h * 0.2, w * 0.05, cx, cy, w * 0.62);

  g.beginPath(); g.ellipse(cx + w * 0.22, cy, w * 0.3, h * 0.45, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx, cy, w * 0.3, h * 0.48, 0, 0, Math.PI * 2); g.fill();

  g.fillRect(-w * 0.05, -h * 0.16, w * 0.1, h * 0.2); g.restore();
  if (w > 18) { g.strokeStyle = '#4a8a30'; g.lineWidth = 1.2; g.beginPath(); g.arc(cx + w * 0.12, y + h * 0.02, w * 0.08, Math.PI, Math.PI * 2.4); g.stroke(); }

  const fx = cx + face * w * 0.05, ey = y + h * 0.45;
  const glowCol = lit ? `rgb(255,${200 + (flick * 40 | 0)},${70 + (flick * 40 | 0)})` : '#3a1400';
  g.fillStyle = glowCol;

    g.beginPath(); g.moveTo(fx + w * 0.08, ey + h * 0.04); g.lineTo(fx + w * 0.19, ey - h * 0.12); g.lineTo(fx + w * 0.3, ey + h * 0.04); g.fill();
  } else { g.fillRect(fx - w * 0.29, ey, w * 0.2, Math.max(1, h * 0.05)); g.fillRect(fx + w * 0.09, ey, w * 0.2, Math.max(1, h * 0.05)); }

  g.quadraticCurveTo(fx, ey + h * 0.55, fx - w * 0.32, ey + h * 0.2); g.fill();

    gg.addColorStop(0, 'rgba(255,220,120,0.35)'); gg.addColorStop(1, 'rgba(255,220,120,0)');

}
function drawPumpkin(x, y, w, h, face, lit, blink) { drawPumpkinArt(ctx, x, y, w, h, face, lit, blink, Math.sin(frame * 0.3) * 0.5 + 0.5); }

function drawPlayerShadow(p, ox, oy) {

}

}

function drawEnemy(e) {
  if (!e.alive) return;
  const x = e.x - cam.x, y = e.y - cam.y;
  if (x < -60 || x > W + 60) return;
  ctx.save();
  if (e.type === 'ghost') {
    const f = e.face || 1;
    ctx.translate(x + e.w / 2, y + Math.sin(frame * 0.07 + e.bx) * 2);
    const glow = ctx.createRadialGradient(0, 14, 4, 0, 14, 34);
    glow.addColorStop(0, 'rgba(200,220,255,0.35)'); glow.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(-36, -22, 72, 72);
    const bg = ctx.createLinearGradient(0, -2, 0, 32);
    bg.addColorStop(0, 'rgba(250,252,255,0.95)'); bg.addColorStop(0.7, 'rgba(220,226,255,0.85)'); bg.addColorStop(1, 'rgba(200,210,255,0.1)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 12, 14, Math.PI, 0); ctx.lineTo(14, 26);
    for (let i = 0; i < 4; i++) { const w = Math.sin(frame * 0.2 + i * 1.3) * 3; ctx.quadraticCurveTo(14 - (i + 0.5) * 7, 34 + w, 14 - (i + 1) * 7, 26); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(160,170,230,0.35)'; ctx.beginPath(); ctx.ellipse(f * -6, 18, 3, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1030';
    ctx.beginPath(); ctx.ellipse(-4 + f * 2, 10, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5 + f * 2, 10, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(1 + f * 2, 19 + Math.sin(frame * 0.1) * 0.8, 2.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(140,200,255,0.9)'; ctx.fillRect(-4 + f * 2, 8, 1.5, 1.5); ctx.fillRect(5 + f * 2, 8, 1.5, 1.5);

    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * 4, -1);
      ctx.quadraticCurveTo(s * 12, -9 - fl * 8, s * 20, -4 - fl * 9);
      ctx.quadraticCurveTo(s * 17, 1 - fl * 3, s * 15, 4 - fl * 2);
      ctx.quadraticCurveTo(s * 12, 1, s * 10, 6 - fl);
      ctx.quadraticCurveTo(s * 7, 3, s * 4, 6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3a2458'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(s * 4, 0); ctx.lineTo(s * 15, 4 - fl * 2); ctx.moveTo(s * 4, 0); ctx.lineTo(s * 10, 6 - fl); ctx.stroke();
    }
    ctx.fillStyle = '#2c1844'; ctx.beginPath(); ctx.ellipse(0, 1, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5, -3); ctx.lineTo(-4, -11); ctx.lineTo(-1, -5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5, -3); ctx.lineTo(4, -11); ctx.lineTo(1, -5); ctx.fill();
    ctx.fillStyle = 'rgba(255,60,60,0.35)'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff4040'; ctx.fillRect(-3.5, -1, 2.5, 2.5); ctx.fillRect(1, -1, 2.5, 2.5);
    ctx.fillStyle = '#fff'; ctx.fillRect(-2, 4, 1, 2); ctx.fillRect(1, 4, 1, 2);
  } else if (e.type === 'spider') {
    const cx = x + e.w / 2, top = e.by - cam.y;
    ctx.strokeStyle = 'rgba(230,230,245,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, y + 4); ctx.stroke();
    ctx.translate(cx, y + 11);
    ctx.strokeStyle = '#140a1c'; ctx.lineWidth = 2;
    const wig = Math.sin(frame * 0.4) * 2;
    for (const s of [-1, 1]) for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(0, -1);
      ctx.lineTo(s * 10, -6 + i * 3 + (i % 2 ? wig : -wig) * 0.5);
      ctx.lineTo(s * 15, 2 + i * 4); ctx.stroke();
    }
    const sg = ctx.createRadialGradient(-2, -5, 1, 0, -2, 10);
    sg.addColorStop(0, '#5a3a72'); sg.addColorStop(1, '#1e1028');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(0, -2, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2e1a40'; ctx.beginPath(); ctx.ellipse(0, 6, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.moveTo(-2, -8); ctx.lineTo(2, -8); ctx.lineTo(0, -4); ctx.lineTo(2, 0); ctx.lineTo(-2, 0); ctx.lineTo(0, -4); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(-4, 6, 2, 2); ctx.fillRect(2, 6, 2, 2); ctx.fillRect(-1.5, 7.5, 1.5, 1.5); ctx.fillRect(0.5, 7.5, 1.5, 1.5);

    ctx.fillRect(-2, 9, 8, 4);
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(-1, 5, 2, 0, 7); ctx.arc(4, 5, 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff6a2a'; ctx.fillRect(-1.5, 4.5, 1, 1); ctx.fillRect(3.5, 4.5, 1, 1);

const CANDY_COLS = [['#ff4fa3', '#ffd23f'], ['#4fd2ff', '#ff6a3a'], ['#9b5cff', '#7cf29a'], ['#ff3b3b', '#ffffff']];
function drawCandy(c, idx) {
  if (c.got) return;
  const x = c.x - cam.x, y = c.y - cam.y + Math.sin(c.t) * 4;
  if (x < -30 || x > W + 30) return;
  if (c.kind === 'life') {
    const gl = ctx.createRadialGradient(x, y, 2, x, y, 26); gl.addColorStop(0, 'rgba(255,150,40,0.45)'); gl.addColorStop(1, 'rgba(255,150,40,0)');
    ctx.fillStyle = gl; ctx.fillRect(x - 26, y - 26, 52, 52);
    drawPumpkin(x - 12, y - 11, 24, 22, 1, true, false);
    ctx.fillStyle = '#7cf29a'; ctx.font = `bold 11px ${FONT_UI}`; ctx.textAlign = 'center'; ctx.fillText('1UP', x, y - 15);
    return;
  }
  const kind = idx % 3, col = CANDY_COLS[idx % 4];
  const gl = ctx.createRadialGradient(x, y, 1, x, y, 18); gl.addColorStop(0, 'rgba(255,240,200,0.3)'); gl.addColorStop(1, 'rgba(255,240,200,0)');

  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(c.t * 0.7) * 0.3);
  if (kind === 0) {           // wrapped sweet
    ctx.fillStyle = col[0];
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-14, -7); ctx.lineTo(-12, 0); ctx.lineTo(-14, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(14, -7); ctx.lineTo(12, 0); ctx.lineTo(14, 7); ctx.fill();
    const g = ctx.createRadialGradient(-2, -3, 1, 0, 0, 9); g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, col[1]); g.addColorStop(1, shade(col[1], -0.3));
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 7.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = col[0]; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(2, 6); ctx.moveTo(1, -7); ctx.lineTo(6, 3); ctx.stroke();
  } else if (kind === 1) {    // candy corn
    ctx.beginPath(); ctx.moveTo(-8, 7); ctx.quadraticCurveTo(0, 10, 8, 7); ctx.lineTo(0, -10); ctx.closePath(); ctx.save(); ctx.clip();
    ctx.fillStyle = '#fff4dc'; ctx.fillRect(-10, -12, 20, 9);
    ctx.fillStyle = '#ff8a1a'; ctx.fillRect(-10, -3, 20, 6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-10, 3, 20, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(-4, -6, 2, 12);

    ctx.fillStyle = col[0]; ctx.beginPath(); ctx.arc(0, -2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let a = 0; a < 12; a += 0.3) { const r = a * 0.6; ctx.lineTo(Math.cos(a + c.t) * r, -2 + Math.sin(a + c.t) * r); } ctx.stroke();
  }
  ctx.restore();
  if (Math.sin(c.t * 1.7 + idx) > 0.92) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 5, y - 9, 2, 6); ctx.fillRect(x + 3, y - 7, 6, 2); }
}

function drawDoor() {
  if (!door) return;
  const x = door.x - cam.x, y = door.y - cam.y;
  if (x < -100 || x > W + 100) return;
  const glow = 0.55 + Math.sin(frame * 0.08) * 0.15;
  const g = ctx.createRadialGradient(x + 16, y + 34, 6, x + 16, y + 34, 90);
  g.addColorStop(0, `rgba(255,200,90,${glow})`); g.addColorStop(1, 'rgba(255,200,90,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 80, y - 60, 190, 190);
  // stone arch
  ctx.fillStyle = '#2a2430';
  ctx.beginPath(); ctx.moveTo(x - 8, y + 64); ctx.lineTo(x - 8, y + 16); ctx.arc(x + 16, y + 16, 24, Math.PI, 0); ctx.lineTo(x + 40, y + 64); ctx.fill();
  for (let i = 0; i < 9; i++) {
    const a = Math.PI + i * Math.PI / 8;
    ctx.fillStyle = i % 2 ? '#5a5264' : '#6a6276';
    ctx.beginPath(); ctx.arc(x + 16, y + 16, 23, a, a + Math.PI / 8 - 0.05); ctx.arc(x + 16, y + 16, 16, a + Math.PI / 8 - 0.05, a, true); ctx.fill();
  }
  for (let j = 0; j < 4; j++) { ctx.fillStyle = j % 2 ? '#5a5264' : '#6a6276'; ctx.fillRect(x - 7, y + 17 + j * 12, 7, 11); ctx.fillRect(x + 32, y + 17 + j * 12, 7, 11); }
  // portal
  const pg = ctx.createLinearGradient(0, y, 0, y + 64);
  pg.addColorStop(0, '#fff2b0'); pg.addColorStop(0.5, '#ffb83a'); pg.addColorStop(1, '#ff6a1a');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.moveTo(x, y + 64); ctx.lineTo(x, y + 16); ctx.arc(x + 16, y + 16, 16, Math.PI, 0); ctx.lineTo(x + 32, y + 64); ctx.fill();
  for (let i = 0; i < 5; i++) {
    const py = y + 60 - ((frame * 0.6 + i * 13) % 50), px = x + 6 + ((i * 7 + frame * 0.1) % 20);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(px, py, 2, 2);
  }
  // torches
  for (const tx of [x - 16, x + 46]) {
    ctx.fillStyle = '#3a2416'; ctx.fillRect(tx - 2, y + 26, 4, 14);
    const fh = 8 + Math.sin(frame * 0.4 + tx) * 2;
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.ellipse(tx, y + 22, 4, fh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe07a'; ctx.beginPath(); ctx.ellipse(tx, y + 24, 2, fh * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#3a2416'; ctx.fillRect(x - 2, y - 26, 36, 14);
  ctx.fillStyle = '#ffd23f'; ctx.font = `bold 11px ${FONT_UI}`; ctx.textAlign = 'center'; ctx.fillText('EXIT', x + 16, y - 15);
}

function drawCheckpoints() {
  for (const c of checkpoints) {
    const x = c.x - cam.x, y = c.y - cam.y;
    if (x < -40 || x > W + 40) continue;
    ctx.fillStyle = '#24160c'; ctx.fillRect(x + 15, y - 6, 4, 38);
    ctx.fillRect(x + 7, y - 6, 14, 3);
    ctx.strokeStyle = '#24160c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 9, y - 3); ctx.lineTo(x + 9, y + 1); ctx.stroke();
    const sway = Math.sin(frame * 0.05 + c.x) * 1.5;
    ctx.save(); ctx.translate(x + 9 + sway, y + 1);
    ctx.fillStyle = '#1a1420'; ctx.fillRect(-6, 0, 12, 3); ctx.fillRect(-5, 15, 10, 3);
    ctx.fillStyle = '#1a1420'; ctx.fillRect(-6, 3, 1.5, 12); ctx.fillRect(4.5, 3, 1.5, 12);
    if (c.on) {

      ctx.fillStyle = '#e9fff0'; ctx.beginPath(); ctx.ellipse(0, 10, 2.2, 4 * fl, 0, 0, Math.PI * 2); ctx.fill();
    } else { ctx.fillStyle = 'rgba(70,60,90,0.8)'; ctx.fillRect(-4.5, 3, 9, 12); }

  }
}

function drawSprings() {
  for (const s of springs) {
    const px = s.x * T - cam.x, py = s.y * T - cam.y;
    if (px < -40 || px > W + 40) continue;
    const sq = springHit && springHit.x === s.x && springHit.y === s.y ? springHit.t / 12 : 0;
    const bob = Math.sin(frame * 0.1 + s.x) * 1;
    ctx.fillStyle = '#3a2a30'; ctx.fillRect(px, py + 20, T, 12);
    const stem = ctx.createLinearGradient(px + 9, 0, px + 23, 0); stem.addColorStop(0, '#f4ead8'); stem.addColorStop(1, '#b8a888');
    ctx.fillStyle = stem; ctx.fillRect(px + 10, py + 12 + sq * 4, 12, 20 - sq * 4);

    cg.addColorStop(0, '#e0a0ff'); cg.addColorStop(0.5, '#a040e8'); cg.addColorStop(1, '#5a1890');
    ctx.fillStyle = cg;

    ctx.fillStyle = '#4a1478'; ctx.fillRect(px - 2 - sq * 3, capY - 1, 36 + sq * 6, 3);
    ctx.fillStyle = '#fbefff';

  }
}

function drawParticles() {
  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.life / 20);
    ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x - cam.x, q.y - cam.y, q.size * 0.7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLayers(cx) {
  const bg = bgCache[themeKey];
  ctx.drawImage(bg.sky, 0, 0);
  if (th.stars) for (let i = 0; i < 18; i++) {
    const a = Math.sin(frame * 0.05 + i * 1.7);
    if (a > 0.6) { ctx.fillStyle = `rgba(255,255,255,${(a - 0.6) * 2})`; const sx = hash(i, 101) * W, sy = hash(i, 102) * H * 0.6; ctx.fillRect(sx - 2, sy, 5, 1); ctx.fillRect(sx, sy - 2, 1, 5); }
  }
  if (!th.cave) for (let i = 0; i < 4; i++) {
    const x = ((hash(i, 111) * 1600 - frame * (0.12 + i * 0.05) - cx * 0.03) % 1600 + 1600) % 1600 - 360;
    ctx.globalAlpha = 0.55; ctx.drawImage(bg.cloud, x, 40 + i * 45); ctx.globalAlpha = 1;

    ctx.drawImage(layer, Math.round(ox), 0); ctx.drawImage(layer, Math.round(ox) + BW, 0);

}
function drawFog(cx, front) {
  const bg = bgCache[themeKey];
  const sp = front ? 0.9 : 0.5, yy = front ? H - 120 : H - 210;
  const off = (((frame * (front ? 0.6 : 0.3) + cx * sp) % 1024) + 1024) % 1024;
  ctx.globalAlpha = th.fogA * (front ? 0.8 : 0.45);

// ---------- Lighting ----------
const lightCv = mk(W, H), lctx = lightCv.getContext('2d');
function drawLighting(extra) {
  const lights = [];
  if (player && state !== 'title') {
    const fl = 1 + Math.sin(frame * 0.3) * 0.04 + Math.sin(frame * 0.71) * 0.03;
    lights.push({ x: player.x + player.w / 2, y: player.y + 10, r: 175 * fl, c: '255,170,70', i: 1, g: 0.22 });
  }
  if (state !== 'title') {
    if (door) lights.push({ x: door.x + 16, y: door.y + 34, r: 210, c: '255,190,90', i: 1, g: 0.25 });
    for (const c of checkpoints) lights.push({ x: c.x + 9, y: c.y + 11, r: c.on ? 140 : 46, c: '124,242,154', i: c.on ? 1 : 0.5, g: c.on ? 0.25 : 0.06 });
    candies.forEach((c, i) => { if (!c.got) lights.push({ x: c.x, y: c.y, r: c.kind === 'life' ? 80 : 46, c: c.kind === 'life' ? '255,150,40' : '255,200,230', i: 0.75, g: 0.08 }); });
    for (const s of springs) lights.push({ x: s.x * T + 16, y: s.y * T + 6, r: 70, c: '190,110,255', i: 0.8, g: 0.12 });
    for (const e of enemies) if (e.alive && e.type === 'ghost') lights.push({ x: e.x + 13, y: e.y + 14, r: 85, c: '190,210,255', i: 0.75, g: 0.1 });
    for (const d of decorLights) lights.push({ x: d.x, y: d.y, r: d.r * (d.f ? 1 + Math.sin(frame * 0.4 + d.x) * 0.06 : 1), c: d.c, i: 0.9, g: 0.12 });
  }
  if (extra) lights.push(...extra);

  lctx.fillStyle = `rgba(${th.darkCol},${state === 'title' ? th.dark * 0.6 : th.dark})`;
  lctx.fillRect(0, 0, W, H);
  lctx.globalCompositeOperation = 'destination-out';
  const vis = [];
  for (const L of lights) {
    const x = L.x - (cam ? cam.x : 0), y = L.y - (cam ? cam.y : 0);
    if (x < -L.r || x > W + L.r || y < -L.r || y > H + L.r) continue;

}
const vignette = (() => {

// ---------- HUD & text ----------
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

}
function drawHUD() {
  const lw = Math.max(1, Math.min(lives, 8));

  for (let i = 0; i < Math.min(lives, 8); i++) drawPumpkin(22 + i * 26, 20, 22, 21, 1, true, false);
  if (lives > 8) { ctx.fillStyle = '#fff'; ctx.font = `bold 14px ${FONT_UI}`; ctx.textAlign = 'left'; ctx.fillText(`x${lives}`, 22 + 8 * 26, 38); }
  panel(20 + w1, 12, 118, 40);
  ctx.save(); ctx.translate(42 + w1, 32); ctx.rotate(-0.3);
  ctx.fillStyle = '#ff4fa3'; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-11, -5); ctx.lineTo(-11, 5); ctx.fill(); ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(11, -5); ctx.lineTo(11, 5); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, 7); ctx.fill(); ctx.restore();
  ctx.fillStyle = levelCandy === levelCandyTotal ? '#7cf29a' : '#ffd23f'; ctx.font = `bold 18px ${FONT_UI}`; ctx.textAlign = 'left';
  ctx.fillText(`${levelCandy}/${levelCandyTotal}`, 58 + w1, 39);
  panel(146 + w1, 12, 120, 40);
  ctx.fillStyle = '#b8a6d9'; ctx.font = `10px ${FONT_UI}`; ctx.fillText('SCORE', 158 + w1, 27);
  ctx.fillStyle = '#ffffff'; ctx.font = `bold 17px ${FONT_UI}`; ctx.fillText(String(score).padStart(7, '0'), 158 + w1, 45);
  ctx.font = `bold 15px ${FONT_UI}`;
  const label = `${levelIdx + 1}/${LEVELS.length}  ${LEVELS[levelIdx].name}`;
  const tw = ctx.measureText(label).width + 28;
  panel(W - 12 - tw, 12, tw, 40);
  ctx.textAlign = 'right'; ctx.fillStyle = '#e8dcff'; ctx.fillText(label, W - 26, 38);
  const st = Snd.muted ? 'Sound off (M)' : !Snd.musicOn ? 'Music off (N)' : '';

}
function centerText(txt, y, size, color, glow, font) {

  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 22; }
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(txt, W / 2 + 2, y + 3);

}

  const g = ctx.createLinearGradient(0, y - size, 0, y);
  g.addColorStop(0, '#ffe07a'); g.addColorStop(0.5, '#ff8c1a'); g.addColorStop(1, '#c0300c');
  ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#2a0a00'; ctx.fillText(txt, W / 2 + 3, y + 4);
  ctx.fillStyle = g; ctx.fillText(txt, W / 2, y);

}

// ---------- Main draw ----------
function draw() {
  frame++;
  if (state === 'title') {
    if (themeKey !== 'patch' || !bgCache.patch) { themeKey = 'patch'; th = THEMES.patch; buildBackground('patch'); }
    const tcx = frame * 0.8;
    drawLayers(tcx);
    drawFog(tcx, false);
    drawAmbient(tcx);
    drawFog(tcx, true);
    cam = cam || { x: 0, y: 0 };
    const savedCam = cam; cam = { x: 0, y: 0 };
    drawLighting([{ x: W / 2, y: 140, r: 260, c: '255,160,60', i: 1, g: 0.3 }]);
    cam = savedCam;
    ctx.drawImage(vignette, 0, 0);
    const py = 70 + Math.sin(frame * 0.05) * 6;
    drawPumpkin(W / 2 - 55, py, 110, 98, 1, true, frame % 160 < 6);
    ctx.fillStyle = '#140a1c';
    ctx.beginPath(); ctx.ellipse(W / 2, py + 6, 52, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W / 2 - 30, py + 4); ctx.quadraticCurveTo(W / 2 - 14, py - 40, W / 2 + 10, py - 62); ctx.quadraticCurveTo(W / 2 + 34, py - 66, W / 2 + 44, py - 52); ctx.quadraticCurveTo(W / 2 + 20, py - 50, W / 2 + 12, py - 30); ctx.lineTo(W / 2 + 30, py + 4); ctx.fill();
    ctx.fillStyle = '#8b5cf6'; ctx.fillRect(W / 2 - 31, py - 8, 62, 9);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(W / 2 - 7, py - 10, 14, 13); ctx.fillStyle = '#8b5cf6'; ctx.fillRect(W / 2 - 3, py - 6, 6, 5);
    titleText("PUMPKIN'S MIDNIGHT RUN", 245, 64);
    centerText('Collect candy · Stomp bats, skeletons & spiders · Dodge ghosts · Reach the glowing door', 290, 16, '#f0e4ff');
    centerText('← → / A D  move      Space / ↑ / W  jump      ↓  drop through ledges', 320, 14, '#c8b6e9');
    panel(W / 2 - 230, 352, 460, 52);
    const arrows = (sel > 0 ? '◀  ' : '    ') + `Level ${sel + 1}/${LEVELS.length}: ${LEVELS[sel].name}` + (sel < unlocked ? '  ▶' : '    ');
    centerText(arrows, 385, 20, '#7cf29a');
    if (Math.floor(frame / 30) % 2) centerText('Press SPACE to start', 445, 28, '#ffd23f', '#ffaa00');
    if (unlocked > 0) centerText(`← → to pick any level you've reached (${unlocked + 1} unlocked)`, 478, 13, '#b8a6d9');
    centerText(`Touch: left side = move, right side = jump      M: ${Snd.muted ? 'unmute' : 'mute'}   N: music ${Snd.musicOn ? 'off' : 'on'}`, 515, 12, '#8a78ac');
    return;
  }
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  let sx = 0, sy = 0;
  if (shake > 0.3) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; shake *= 0.85; } else shake = 0;
  drawLayers(cx);
  drawFog(cx, false);
  ctx.save(); ctx.translate(sx, sy);
  const camSave = cam; cam = { x: cx, y: cy };
  ctx.drawImage(tileCv, cx, cy, W, H, 0, 0, W, H);
  drawSprings();
  drawDoor();
  drawCheckpoints();
  candies.forEach((c, i) => drawCandy(c, i));
  for (const e of enemies) drawEnemy(e);
  if (state === 'play' || state === 'levelDone') drawPlayer();
  drawParticles();
  drawAmbient(cx);
  drawFog(cx, true);
  drawLighting();
  cam = camSave;
  ctx.restore();
  if (flash > 0.02) { ctx.fillStyle = `rgba(225,232,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); flash *= flash > 0.6 ? 0.8 : 0.9; if (Math.random() < 0.04 && flash > 0.3) flash = 0.9; } else flash = 0;
  ctx.drawImage(vignette, 0, 0);
  drawHUD();
  if (fade > 0) { ctx.fillStyle = `rgba(5,2,10,${fade})`; ctx.fillRect(0, 0, W, H); fade = Math.max(0, fade - 0.035); }

  if (state === 'levelDone') {
    ctx.fillStyle = 'rgba(10,4,20,0.55)'; ctx.fillRect(0, H / 2 - 80, W, 140);
    titleText('Level Complete!', H / 2 - 5, 54);
    centerText(levelCandy === levelCandyTotal ? 'All candy collected!  +2000' : `Candy: ${levelCandy}/${levelCandyTotal}`, H / 2 + 35, 20, '#e8dcff');
  } else if (state === 'dead') {
    ctx.fillStyle = 'rgba(80,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = `58px ${FONT_T}`; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 25; ctx.fillStyle = '#ff4f4f'; ctx.fillText('Ouch!', W / 2, H / 2); ctx.shadowBlur = 0;
  } else if (state === 'gameover' || state === 'win') {
    ctx.fillStyle = 'rgba(10,4,20,0.78)'; ctx.fillRect(0, 0, W, H);
    if (state === 'win') { titleText('HAPPY HALLOWEEN!', H / 2 - 50, 66); centerText('You survived the midnight run!', H / 2, 22, '#e8dcff'); }
    else { ctx.textAlign = 'center'; ctx.font = `66px ${FONT_T}`; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 25; ctx.fillStyle = '#ff4f4f'; ctx.fillText('GAME OVER', W / 2, H / 2 - 50); ctx.shadowBlur = 0; centerText('The night got the better of you...', H / 2, 22, '#e8dcff'); }
    centerText(`Score: ${score}    Candy: ${candyTotal}`, H / 2 + 40, 22, '#ffd23f');
    if (timer > 40 && Math.floor(frame / 30) % 2) centerText('Press SPACE to play again', H / 2 + 100, 20, '#b8a6d9');
  }
}

// ---------- Loop (fixed timestep) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;

requestAnimationFrame(loop);

})();
